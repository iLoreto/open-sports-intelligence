name: Build web
on:
  push:
    branches: [main]
  pull_request:
jobs:
  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:cache && npm run test:nba-api && npm run test:nhl-xg
      - run: npm run typecheck:worker
      - run: npm run build
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Playwright E2E regression tests
        run: npx playwright test --config=playwright.config.cjs
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
