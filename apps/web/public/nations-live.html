<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081321"><title>Nations League — ESPN Live Scores</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#07111e;color:#eff6ff}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:clamp(24px,5vw,36px);margin:4px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#64cfff}.muted{color:#9cb0c8;font-size:13px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button{background:#15518a;border:1px solid #4c8ac1;border-radius:9px;padding:10px 15px;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6}select{background:#132a43;color:white;border:1px solid #375575;border-radius:9px;padding:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.match{border:1px solid #2b4360;background:#102138;border-radius:16px;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.state{border-radius:20px;background:#273b50;padding:5px 10px;font-size:12px;font-weight:750}.state.live{background:#5b3220;color:#ffcf9c}.state.final{background:#23513e;color:#b3ffd2}.teams{display:grid;grid-template-columns:1fr auto;gap:13px;align-items:center}.names{display:flex;flex-direction:column;gap:12px;font-size:17px;font-weight:750}.score{display:flex;flex-direction:column;gap:6px;font-size:32px;font-weight:850;text-align:right;line-height:1.1;font-variant-numeric:tabular-nums}.ticket{font-size:11px;color:#9cb0c8;margin-top:12px;padding-top:9px;border-top:1px dashed #37516a}.ticket input{width:74px;background:#0a1726;color:#e9f2ff;border:1px solid #37516a;border-radius:5px;padding:3px;font-size:11px}.stats{margin-top:17px;padding-top:15px;border-top:1px solid #2b4360}.stat{margin:13px 0}.statline{display:flex;justify-content:space-between;gap:10px;font-size:13px}.statname{color:#a8bad0}.bar{display:flex;height:7px;overflow:hidden;border-radius:9px;background:#334960;margin-top:7px}.bar span{background:#5cc6ff}.bar i{background:#efb25f;flex:1}.insight{margin:13px 0;padding:12px;background:#0a3044;border-left:3px solid #61c9ff;border-radius:7px;font-size:13px;line-height:1.6}.insight strong{color:#bdeaff}.spark{width:100%;height:55px;display:block;margin:8px 0}.summary{background:#102138;border:1px solid #2b4360;border-radius:14px;padding:14px;margin:12px 0}.summary strong{font-size:20px}.empty{padding:22px;border:1px solid #2b4360;border-radius:14px}.footer{margin-top:20px;line-height:1.7}a{color:#8edaff}@media(max-width:700px){main{padding:13px}.grid{grid-template-columns:1fr}.match{padding:15px}}
</style></head><body><main>
<header><div><div class="eyebrow">iLORETO DEVELOPMENT · ESPN MATCH CENTER</div><h1>⚽ Nations League Live Scores</h1><div class="muted">Teams · goals · possession · match statistics · ESPN source</div></div><div class="toolbar"><select id="filter" aria-label="Filter matches"><option value="all">All fixtures</option><option value="live">Live</option><option value="final">Final</option><option value="scheduled">Upcoming</option></select><button id="refresh">Refresh ESPN</button></div></header>
<p class="muted" id="status" role="status">Connecting to ESPN…</p><section id="overview" class="summary" aria-label="Ticket overview"></section><section class="grid" id="matches" aria-label="ESPN Nations League fixtures"></section>

</main><script>
'use strict';
const byId=id=>document.getElementById(id);
const tickets=[['North Macedonia','Scotland',19.99],['Germany','Serbia',24.99],['Faroe Islands','Slovakia',60],['Greece','Netherlands',30],['Iceland','Bulgaria',29.51],['Gibraltar','Andorra',24.60],['Azerbaijan','Liechtenstein',24.43]];
const normalize=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
const ticketKey=(a,b)=>[normalize(a),normalize(b)].sort().join(':');
const findTicket=e=>tickets.find(t=>ticketKey(t[0],t[1])===ticketKey(e.home,e.away));
const money=n=>'$'+Number(n).toFixed(2);
const confirmedTickets={
 [ticketKey('Iceland','Bulgaria')]:{stake:29.51,payout:49.18,label:'Single ticket'},
 [ticketKey('Azerbaijan','Liechtenstein')]:{stake:24.43,payout:29.47,label:'Single ticket'},
 [ticketKey('Gibraltar','Andorra')]:{stake:24.60,payout:40.04,label:'Single ticket'},
 [ticketKey('Netherlands','Greece')]:{stake:30,payout:45.11,label:'Single ticket'},
 [ticketKey('Germany','Serbia')]:{stake:24.99,payout:31.84,label:'Single ticket'},
 [ticketKey('Slovakia','Faroe Islands')]:{stake:60,payout:85.71,label:'Single ticket'}
};
const parlay={stake:75,payout:155.01,legs:['Scotland','Germany','Slovakia']};
let events=[],loading=false;
function node(tag,cls,value){const x=document.createElement(tag);if(cls)x.className=cls;if(value!==undefined)x.textContent=String(value);return x}
function metric(root,label,a,b,bar=false){const wrap=node('div','stat'),line=node('div','statline');line.append(node('strong','',a??'—'),node('span','statname',label),node('strong','',b??'—'));wrap.append(line);if(bar&&a!==null&&b!==null){const left=parseFloat(a),right=parseFloat(b);if(Number.isFinite(left)&&Number.isFinite(right)&&left+right>0){const track=node('div','bar'),fill=node('span');fill.style.width=(100*left/(left+right))+'%';track.append(fill,node('i'));wrap.append(track)}}root.append(wrap)}
const num=v=>v===null||v===undefined||v===''?null:Number.parseFloat(String(v).replace('%',''));
function matchInsight(e){
 const h=e.stats?.home||{},a=e.stats?.away||{};
 const fields=[['Possession','possession','%'],['Shots','shots',''],['Shots on target','shotsOnTarget',''],['Expected goals (xG)','xg',''],['Corners','corners',''],['Fouls','fouls',''],['Yellow cards','yellowCards',''],['Red cards','redCards','']];
 const lines=[];
 for(const [label,key,suffix] of fields){
  const home=num(h[key]),away=num(a[key]);
  if(Number.isFinite(home)&&Number.isFinite(away))lines.push(label+': '+e.home+' '+home+suffix+' / '+e.away+' '+away+suffix);
 }
 return lines.length?lines.join(' · '):'No comparative match statistics provided by ESPN.';
}
function chart(root,e){
 const keys=[['Possession','possession'],['Shots','shots'],['Shots on target','shotsOnTarget'],['xG','xg'],['Corners','corners'],['Pass accuracy','passAccuracy']];
 const available=keys.map(([label,key])=>({label,left:num(e.stats?.home?.[key]),right:num(e.stats?.away?.[key])})).filter(x=>Number.isFinite(x.left)&&Number.isFinite(x.right));
 if(!available.length)return;
 const title=node('div','muted','MATCH STATISTICS · '+e.home+' (blue) / '+e.away+' (amber)');root.append(title);
 for(const x of available){const wrap=node('div','stat'),line=node('div','statline');line.append(node('strong','',x.left),node('span','statname',x.label),node('strong','',x.right));wrap.append(line);
 const bar=node('div','bar'),left=node('span'),right=node('i');const total=x.left+x.right;left.style.width=(total>0?100*x.left/total:50)+'%';bar.append(left,right);wrap.append(bar);root.append(wrap);}
}
const selections=[
 {home:'North Macedonia',away:'Scotland',pick:'Scotland'},
 {home:'Germany',away:'Serbia',pick:'Germany'},
 {home:'Faroe Islands',away:'Slovakia',pick:'Slovakia'},
 {home:'Greece',away:'Netherlands',pick:'Netherlands'},
 {home:'Switzerland',away:'Slovenia',pick:'Switzerland'},
 {home:'Iceland',away:'Bulgaria',pick:'Iceland'},
 {home:'Gibraltar',away:'Andorra',pick:'Andorra'},
 {home:'Azerbaijan',away:'Liechtenstein',pick:'Azerbaijan'}
];
function resultFor(selection){
 const event=events.find(e=>ticketKey(e.home,e.away)===ticketKey(selection.home,selection.away));
 if(!event||String(event.status).toLowerCase()!=='final'||!Number.isFinite(event.homeScore)||!Number.isFinite(event.awayScore))return 'pending';
 if(event.homeScore===event.awayScore)return 'loss';
 const winner=event.homeScore>event.awayScore?event.home:event.away;
 return normalize(winner)===normalize(selection.pick)?'win':'loss';
}
function settlement(){
 const singleResults=selections.filter(selection=>confirmedTickets[ticketKey(selection.home,selection.away)]).map(selection=>({ticket:confirmedTickets[ticketKey(selection.home,selection.away)],result:resultFor(selection),pick:selection.pick}));
 const parlayLegs=selections.filter(selection=>parlay.legs.includes(selection.pick)).map(selection=>({pick:selection.pick,result:resultFor(selection)}));
 const parlayResult=parlayLegs.some(r=>r.result==='loss')?'loss':parlayLegs.length===parlay.legs.length&&parlayLegs.every(r=>r.result==='win')?'win':'pending';
 const all=[...singleResults,{ticket:parlay,result:parlayResult}];
 const stake=all.reduce((n,r)=>n+r.ticket.stake,0);
 const payout=all.reduce((n,r)=>n+(r.result==='loss'?0:r.ticket.payout),0);
 const profit=payout-stake;
 return {stake,payout,profit,all};
}
function renderOverview(){
 const {stake,payout,profit}=settlement();
 const el=byId('overview');el.replaceChildren();
 for(const [label,value] of [['Stake',stake],['Payout',payout],['Profit',profit]]){
  const item=node('div',''),name=node('span','muted',label+' '),amount=node('strong','', (label==='Profit'&&value>0?'+':'')+money(value));
  item.append(name,amount);el.append(item);
 }
}
function render(){
 renderOverview();
 const root=byId('matches');root.replaceChildren();
 const filter=byId('filter').value;
 const selected=events.filter(e=>findTicket(e)&&(filter==='all'||String(e.status).toLowerCase()===filter));
 if(!selected.length){root.append(node('p','empty','No ticketed fixtures available from ESPN for this date/filter. Ticket summary remains available above.'));return}
 for(const e of selected){
  const card=node('article','match'),head=node('div','head'),live=e.status==='Live';
  head.append(node('span','muted',e.date?new Date(e.date).toLocaleString():'Nations League'),node('span','state '+(live?'live':e.status==='Final'?'final':''),e.status+(live&&e.minute!==null?' · '+e.minute+' min':'')));card.append(head);
  const teams=node('div','teams'),names=node('div','names'),scores=node('div','score');
  names.append(node('div','',e.home),node('div','',e.away));scores.append(node('div','',e.homeScore??'—'),node('div','',e.awayScore??'—'));teams.append(names,scores);card.append(teams);
  const insight=node('div','insight');insight.append(node('strong','','GAME READ · '),document.createTextNode(matchInsight(e)));card.append(insight);
  const comparison=node('div','stats');chart(comparison,e);card.append(comparison);
  const info=confirmedTickets[ticketKey(e.home,e.away)];
  const outcome=resultFor(selections.find(x=>ticketKey(x.home,x.away)===ticketKey(e.home,e.away)));
  const small=info?node('div','muted','Single ticket · '+outcome.toUpperCase()+' · Stake '+money(info.stake)+' · Payout '+money(outcome==='loss'?0:info.payout)+' · Profit '+money((outcome==='loss'?0:info.payout)-info.stake)):null;
  if(small){small.style.fontSize='11px';small.style.marginTop='12px';card.append(small);}
  if(parlay.legs.some(t=>normalize(e.home)===normalize(t)||normalize(e.away)===normalize(t)))card.append(node('div','ticket','Also in 3-leg parlay · Scotland / Germany / Slovakia · Shared stake $75.00 · Shared payout $155.01 (counted once)'));
  root.append(card);
 }
}
async function refresh(){
 if(loading)return;loading=true;byId('refresh').disabled=true;
 try{
  const res=await fetch('/api/nations/scoreboard',{cache:'no-store'});
  if(!res.ok)throw Error('HTTP '+res.status);
  const data=await res.json();if(!Array.isArray(data.events))throw Error('Invalid ESPN response');
  events=data.events;render();byId('status').textContent='ESPN checked '+new Date(data.fetchedAt).toLocaleTimeString()+' · '+events.length+' fixtures';
 }catch(error){byId('status').textContent='ESPN unavailable: '+error.message;render()}
 finally{loading=false;byId('refresh').disabled=false}
}
byId('filter').addEventListener('change',render);
byId('refresh').addEventListener('click',refresh);
setInterval(()=>{if(!document.hidden)refresh()},60000);
render();refresh();
</script></body></html>
